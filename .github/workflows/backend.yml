name: Backend Foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test local provisioning helper
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Generate ephemeral local credentials
        run: ./scripts/init-local-env
      - name: Build backend
        run: docker compose build backend
      - name: Start PostgreSQL and migrate
        run: |
          docker compose up -d --wait db
          docker compose run --rm migrate
      - name: Test real PostgreSQL runtime role
        run: docker compose run --rm test
      - name: Validate style, lockfile and PHP extensions
        run: |
          docker compose run --rm test vendor/bin/pint --test
          docker compose run --rm test composer validate --strict
          docker compose run --rm test composer check-platform-reqs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck, unit tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Prepare synthetic browser fixtures in blusser_test only
        run: |
          docker compose run --rm test php artisan test --filter=BrowserFixtureTest
          printf 'services:\n  backend:\n    environment:\n      DB_DATABASE: blusser_test\n' > /tmp/blusser-browser.yaml
          docker compose -f compose.yaml -f /tmp/blusser-browser.yaml up -d --wait backend
      - name: Browser regression with real Sanctum sessions
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: HTTP smoke
        run: |
          curl --fail --silent http://localhost:8000/api/v1/health
      - name: Clean disposable CI database
        if: always()
        run: docker compose down -v
