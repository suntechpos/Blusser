{
  "openapi": "3.1.0",
  "info": {
    "title": "Blusser Sprint 2 API",
    "version": "0.2.0",
    "description": "CEO-governed multi-tenant clinic management. First-party Sanctum cookie authentication, mandatory CSRF on mutations, Secure/HttpOnly/SameSite=Lax session cookies and encrypted server payload. Secure cookies may be disabled ONLY for documented localhost HTTP development. No public registration, bearer tokens, frontend or medical/financial APIs. All clinic routes use active_tenant_id selected on server, ignore client context overrides and recheck current RBAC; platform has no default tenant-data access. Successful critical mutations are atomic with secret-free audit. PostgreSQL FORCE RLS remains enabled; API only uses runtime credentials. List pages contain up to 50 rows; my-clinics and pending proposals return only the authenticated identity records. Input properties not declared in DTOs are ignored, never used to set authority. For assigned_branches delegation, destination visible branch ids must be a subset of the initiating actor branch set for each restricted permission; checks run before commit and cannot be bypassed by creating/resetting another account."
  },
  "servers": [
    {
      "url": "http://localhost:8000",
      "description": "Local development only; use HTTPS and secure cookie in deployed environments."
    }
  ],
  "tags": [
    {
      "name": "Identity"
    },
    {
      "name": "Platform"
    },
    {
      "name": "Clinic"
    }
  ],
