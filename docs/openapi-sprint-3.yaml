        "description": "Implemented Stage 3. Full cookie identity and selected clinic required. Tenant RLS and live branch grants apply. Mutations require entire_clinic action and view permissions, strict payloads and Idempotency-Key. Replays reauthorize current actor; changed payload returns 409. POST/PUT extension approved by project owner. No implicit employee grants. Specialty response retains Stage-1 id/name fields."
      }
